<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Ap</title>
    <!-- css -->
    <style>

    </style>
</head>

<body>
    <form onsubmit="handelTodo(event)">
        <h2>Create Todo</h2>
        <input type="text" name="todo" id="todo">
        <button type="submit">create</button>
    </form>

    <!-- todo list -->
    <div id="TodoData"></div>

    <!-- javascript -->
    <script>
        function handelTodo(event) {
            event.preventDefault();
            const Todo = document.getElementById("todo").value; // get todo data
            const showTodo = document.getElementById("TodoData"); 

            let _ToDo = [Todo];

            _ToDo = [Todo,...Todo]

            showTodo.innerHTML = _ToDo;
        }
    </script>
</body>

</html>
